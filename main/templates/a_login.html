{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Amma Dance Collections</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           1. FUTURISTIC VARIABLES & RESET
        ========================================= */
        :root {
            --bg-deep: #030304;
            --bg-panel: rgba(15, 15, 18, 0.6);
            --gold: #D4AF37;
            --gold-bright: #FFE58F;
            --text-main: #E8E8E8;
            --text-muted: #8A8A93;
            --danger: #ff4757;
            --glow-subtle: 0 0 15px rgba(212, 175, 55, 0.15);
            --glow-strong: 0 0 30px rgba(212, 175, 55, 0.5);
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: var(--bg-deep); 
            color: var(--text-main); 
            font-family: var(--font-body); 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Futuristic background pattern */
        .digital-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(212, 175, 55, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 175, 55, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        /* =========================================
           2. LOGIN PANEL
        ========================================= */
        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            animation: fadeInUp 1s ease;
        }

        .login-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-top: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 8px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), var(--glow-subtle);
        }

        .login-panel h2 {
            font-family: var(--font-heading);
            color: var(--gold-bright);
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: var(--glow-subtle);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        /* Error Message Display */
        .error-msg {
            color: var(--danger);
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        /* =========================================
           3. FORM INPUTS
        ========================================= */
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.15); /* Made the background lighter! */
            border: 2px solid var(--gold); /* Added a thick gold border! */
            padding: 15px;
            color: #ffffff;
            font-family: var(--font-body);
            font-size: 1rem;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
            box-shadow: var(--glow-subtle);
        }

        /* =========================================
           4. GLOWING BUTTON
        ========================================= */
        .btn-submit {
            width: 100%;
            margin-top: 15px;
            padding: 18px;
            background: linear-gradient(90deg, rgba(212,175,55,0.1), rgba(212,175,55,0.2));
            color: var(--gold-bright);
            border: 1px solid var(--gold);
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .btn-submit:hover {
            background: var(--gold);
            color: var(--bg-deep);
            box-shadow: var(--glow-strong);
            transform: translateY(-2px);
        }

        /* Go back link */
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--gold);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="digital-grid"></div>

    <div class="login-container">
        <div class="login-panel">
            <h2>Admin Portal</h2>
            <p class="subtitle">Authorized access only.</p>

            <!-- Dynamic Error Message System -->
            {% if messages %}
                {% for message in messages %}
                    <div class="error-msg">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <label>Username</label>
                    <!-- Missing "name" attribute fixed here! -->
                    <input type="text" name="username" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <!-- Missing "name" attribute fixed here! -->
                    <input type="password" name="password" required>
                </div>

                <button type="submit" class="btn-submit">Secure Login</button>
            </form>

            <a href="{% url 'home' %}" class="back-link">← Return to Main Site</a>
        </div>
    </div>

</body>
</html>
