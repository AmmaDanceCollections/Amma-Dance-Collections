{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | Amma Dance Collections</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-deep: #030304; --bg-panel: rgba(15, 15, 18, 0.7); --gold: #D4AF37; --gold-bright: #FFE58F; --text-main: #E8E8E8; --text-muted: #8A8A93; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Montserrat', sans-serif; display: flex; }
        
        /* SIDEBAR */
        .sidebar { width: 260px; height: 100vh; background: rgba(5,5,7,0.95); border-right: 1px solid rgba(212,175,55,0.2); position: fixed; padding: 30px 0; display: flex; flex-direction: column; }
        .logo-area { text-align: center; margin-bottom: 50px; }
        .logo-area img { width: 80px; margin-bottom: 15px; }
        .nav-links { list-style: none; }
        .nav-links li { margin-bottom: 5px; }
        .nav-links a { display: block; padding: 15px 30px; color: var(--text-muted); text-decoration: none; font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; transition: 0.3s; border-left: 3px solid transparent; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold-bright); border-left-color: var(--gold); background: rgba(212,175,55,0.05); }
        
        /* MAIN CONTENT */
        .main-content { margin-left: 260px; padding: 60px; width: calc(100% - 260px); }
        h1 { font-family: 'Playfair Display', serif; color: var(--gold-bright); font-size: 2.8rem; margin-bottom: 50px; letter-spacing: 2px; border-bottom: 1px solid rgba(212,175,55,0.2); padding-bottom: 20px; }
        
        /* DASHBOARD STATS */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
        .stat-card { background: var(--bg-panel); border: 1px solid rgba(212,175,55,0.2); border-radius: 8px; padding: 40px; text-align: center; transition: 0.3s; }
        .stat-card:hover { transform: translateY(-10px); border-color: var(--gold); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .stat-title { color: var(--text-muted); font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 15px; }
        .stat-number { color: var(--gold-bright); font-size: 4rem; font-family: 'Playfair Display', serif; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-area">
            <img src="{% static 'logo.png' %}" alt="Logo">
        </div>
        <ul class="nav-links">
            <li><a href="{% url 'a_home' %}" class="active">Dashboard</a></li>
            <li><a href="{% url 'manage_products' %}">Manage Products</a></li>
            <li><a href="{% url 'orders' %}">Orders / Inquiries</a></li>
            <li><a href="{% url 'home' %}" target="_blank">View Live Site</a></li>
        </ul>
    </div>

    <div class="main-content">
        <h1>Admin Dashboard</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Total Products in Database</div>
                <div class="stat-number">{{ total_products }}</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-title">Active Pending Orders</div>
                <div class="stat-number">{{ active_orders }}</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">Total Lifetime Inquiries</div>
                <div class="stat-number">{{ total_inquiries }}</div>
            </div>
        </div>
    </div>

</body>
</html>
