{% extends 'base.html' %}
{% load static %}

{% block title %}Checkout | Amma Dance Studio{% endblock %}

{% block extra_css %}
<style>
    .checkout-container { padding: 10vh 4vw 15vh 4vw; max-width: 900px; margin: 0 auto; }
    .checkout-header { font-family: var(--font-serif); font-size: clamp(3rem, 7vw, 5rem); font-weight: 400; text-transform: uppercase; letter-spacing: -0.02em; margin-bottom: 6vh; border-bottom: 1px solid var(--border-subtle); padding-bottom: 2vh; }
    .checkout-form { display: flex; flex-direction: column; gap: 40px; }
    .form-group { display: flex; flex-direction: column; gap: 12px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
    .form-label { font-family: var(--font-sans); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); }
    .form-input { background: transparent; border: none; border-bottom: 1px solid var(--border-subtle); color: var(--text-light); font-family: var(--font-sans); font-size: 1.2rem; padding: 12px 0; outline: none; transition: border-color var(--transition-fast); width: 100%; }
    .form-input:focus { border-bottom-color: var(--accent-gold); }
    .btn-place-order { background: var(--text-light); color: var(--bg-dark); font-family: var(--font-sans); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; padding: 22px 40px; border: none; cursor: pointer; transition: all var(--transition-fast); margin-top: 20px; align-self: flex-start; }
    .btn-place-order:hover { background: var(--accent-gold); color: var(--bg-dark); }
    @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; gap: 40px; } .btn-place-order { width: 100%; text-align: center; } }
</style>
{% endblock %}

{% block content %}
<div class="checkout-container">
    <h1 class="checkout-header">Shipping Details</h1>

    {% if messages %}
        <div style="color: #ff4444; margin-bottom: 20px; font-family: var(--font-sans);">
            {% for message in messages %}
                {{ message }}
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" class="checkout-form">
        {% csrf_token %}
        
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="customer_name" required class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <!-- STRICT VALIDATION ADDED HERE -->
                <input type="tel" name="phone_number" required class="form-input" 
                       pattern="[0-9]{10}" 
                       maxlength="10" 
                       title="Please enter a valid 10-digit phone number">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">House / Building Name</label>
            <input type="text" name="house_name" required class="form-input">
        </div>

        <div class="form-group">
            <label class="form-label">Street / Area</label>
            <input type="text" name="street" required class="form-input">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label">City</label>
                <input type="text" name="city" required class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Pincode</label>
                <!-- STRICT VALIDATION ADDED HERE -->
                <input type="text" name="pincode" required class="form-input" 
                       pattern="[0-9]{6}" 
                       maxlength="6" 
                       title="Please enter a valid 6-digit PIN code">
            </div>
        </div>

        <button type="submit" class="btn-place-order">Confirm Order ↗</button>
    </form>
</div>
{% endblock %}
