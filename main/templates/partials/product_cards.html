{% for product in products %}
<a href="{% url 'product_detail' product.id %}" class="product-card block overflow-hidden rounded-2xl border border-white/10 bg-neutral-900">
    <div class="relative">
        {% if product.image %}
            <img src="{{ product.image.url }}" alt="{{ product.name }}" class="h-72 w-full object-cover" />
        {% else %}
            <div class="flex h-72 items-center justify-center bg-gradient-to-br from-yellow-700/30 to-neutral-800 text-neutral-400">No Image</div>
        {% endif %}
        <button type="button" data-toggle-favorite="{{ product.id }}" class="absolute right-3 top-3 rounded-full bg-black/60 px-3 py-2 text-[10px] uppercase tracking-[0.2em] text-white hover:bg-yellow-400 hover:text-black">Save</button>
    </div>

    <div class="space-y-4 p-5">
        <div class="flex items-start justify-between gap-3">
            <div>
                <p class="text-[10px] uppercase tracking-[0.25em] text-yellow-300">{{ product.category }}</p>
                <h3 class="mt-2 text-xl font-medium text-white">{{ product.name }}</h3>
            </div>
            <span class="whitespace-nowrap text-lg font-semibold text-yellow-300">₹{{ product.price }}</span>
        </div>

        <p class="text-sm text-neutral-400">{{ product.description|truncatechars:95 }}</p>

        <div class="flex items-center justify-between">
            <span class="text-[10px] uppercase tracking-[0.2em] text-neutral-500">{{ product.style }}</span>
            <button type="button" data-add-to-cart="{{ product.id }}" class="rounded-full bg-yellow-400 px-4 py-2 text-[10px] font-semibold uppercase tracking-[0.2em] text-black hover:bg-yellow-300">Add to Cart</button>
        </div>
    </div>
</a>
{% empty %}
<div class="col-span-full rounded-2xl border border-dashed border-neutral-700 bg-neutral-900/60 p-10 text-center text-neutral-400">
    No products match your filters.
</div>
{% endfor %}
